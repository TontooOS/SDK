[package]
name = "sdk"
version = "26.1.0"
edition = "2021"
license = "TCL"
description = "TontooOS system SDK: thin dynamic bindings to the frameworks in /Library/System"
readme = "README.md"
keywords = ["tontoo", "sdk", "ffi", "system"]
categories = ["os"]

[dependencies]
libloading = "0.8"
# Re-exported frameworks (PascalCase dirs preserved per user decision).
# Optional – enable via `features = ["uikit"]` etc. so apps pay only for what they use.
accessibility = { package = "accessibility", path = "../Accessibility", optional = true }
archivekit = { package = "archivekit", path = "../ArchiveKit", optional = true }
audiokit = { package = "audiokit", path = "../AudioKit", optional = true }
coredata = { package = "coredata", path = "../CoreData", optional = true }
coreicon = { package = "coreicon", path = "../CoreIcon", optional = true }
coreimage = { package = "coreimage", path = "../CoreImage", optional = true }
corelocation = { package = "corelocation", path = "../CoreLocation", optional = true }
coretext = { package = "coretext", path = "../CoreText", optional = true }
corewindows = { package = "corewindows", path = "../CoreWindows", optional = true }
documentkit = { package = "documentkit", path = "../DocumentKit", optional = true }
fishfile = { package = "fishfile", path = "../FishFile", optional = true }
foundation = { package = "foundation", path = "../Foundation", optional = true }
mapskit = { package = "mapskit", path = "../MapsKit", optional = true }
mediakit = { package = "mediakit", path = "../MediaKit", optional = true }
networkkit = { package = "networkkit", path = "../NetworkKit", optional = true }
coresettings = { package = "coresettings", path = "../CoreSettings", optional = true }
launchpad = { package = "launchpad-lib", path = "../LaunchPad", optional = true }
pdfkit = { package = "pdfkit", path = "../PDFKit", optional = true }
sqlkit = { package = "sqlkit", path = "../SQLKit", optional = true }
tontooui = { package = "tontooui", path = "../TontooUI", optional = true }
weatherkit = { package = "weatherkit", path = "../WeatherKit", optional = true }
webkit = { package = "webkit", path = "../WebKit", optional = true }

[features]
default = []
accessibility = ["dep:accessibility"]
archivekit = ["dep:archivekit"]
audiokit = ["dep:audiokit"]
coredata = ["dep:coredata"]
coreicon = ["dep:coreicon"]
coreimage = ["dep:coreimage"]
corelocation = ["dep:corelocation"]
coretext = ["dep:coretext"]
corewindows = ["dep:corewindows"]
documentkit = ["dep:documentkit"]
fishfile = ["dep:fishfile"]
foundation = ["dep:foundation"]
mapskit = ["dep:mapskit"]
mediakit = ["dep:mediakit"]
networkkit = ["dep:networkkit"]
coresettings = ["dep:coresettings"]
launchpad = ["dep:launchpad"]
pdfkit = ["dep:pdfkit"]
sqlkit = ["dep:sqlkit"]
tontooui = ["dep:tontooui"]
weatherkit = ["dep:weatherkit"]
webkit = ["dep:webkit"]
# PascalCase aliases (so `features = ["TontooUI"]` works as expected)
Accessibility = ["accessibility"]
ArchiveKit = ["archivekit"]
AudioKit = ["audiokit"]
CoreData = ["coredata"]
CoreIcon = ["coreicon"]
CoreImage = ["coreimage"]
CoreLocation = ["corelocation"]
CoreText = ["coretext"]
CoreWindows = ["corewindows"]
DocumentKit = ["documentkit"]
FishFile = ["fishfile"]
Foundation = ["foundation"]
MapsKit = ["mapskit"]
MediaKit = ["mediakit"]
NetworkKit = ["networkkit"]
CoreSettings = ["coresettings"]
LaunchPad = ["launchpad"]
PDFKit = ["pdfkit"]
SQLKit = ["sqlkit"]
TontooUI = ["tontooui"]
WeatherKit = ["weatherkit"]
WebKit = ["webkit"]
# Convenience: all frameworks except LaunchPad (excluded per plan)
full = ["accessibility","archivekit","audiokit","coredata","coreicon","coreimage","corelocation","coretext","corewindows","documentkit","fishfile","foundation","mapskit","mediakit","networkkit","coresettings","pdfkit","sqlkit","tontooui","weatherkit","webkit"]
Full = ["full"]

[lib]
name = "sdk"
crate-type = ["rlib"]
